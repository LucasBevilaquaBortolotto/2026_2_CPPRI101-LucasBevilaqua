{% extends 'principal.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 text-center">
                <div class="fs-1 text-danger mb-3">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3 class="mb-3 fw-bold text-dark">Excluir Multa</h3>
                <p class="text-muted mb-4">Tem a certeza de que pretende eliminar a multa <strong>#{{ object.idMulta }}</strong>?</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'multas' %}" class="btn btn-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4">Sim, Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
