{% extends 'principal.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 text-center">
                <div class="fs-1 text-danger mb-3">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3 class="mb-3 fw-bold text-dark">Excluir Locação</h3>
                <p class="text-muted mb-4">
                    Tem a certeza de que pretende eliminar a locação <strong>#{{ object.idLocacao }}</strong> do cliente <strong>{{ object.cliente.nome }}</strong>? Esta ação não pode ser desfeita.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'locacoes' %}" class="btn btn-secondary px-4">
                            <i class="fas fa-arrow-left me-2"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fas fa-trash-alt me-2"></i>Sim, Excluir
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
