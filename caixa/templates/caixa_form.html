{% extends 'principal.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Editar Caixa{% else %}Abrir Novo Caixa{% endif %}</h2>

    <form method="post" class="mt-4">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'caixas' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
