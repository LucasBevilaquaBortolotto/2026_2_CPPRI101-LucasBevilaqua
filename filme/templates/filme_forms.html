<head>
  {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
{% block head %}
    {% include "head.html" %}
{% endblock %}


    <div class="container my-3 my-md-5 px-2 px-sm-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-3 p-sm-4">
                        <h3 class="card-title text-center mb-4 fw-bold text-dark fs-4 fs-sm-3">
                            Cadastro de Filmes
                        </h3>
                        <form method="POST" enctype="multipart/form-data" novalidate>
                          {% csrf_token %}
                          {{ form.as_p }}
                            <div class="d-grid d-sm-flex justify-content-sm-end gap-2 mt-4 pt-2 border-top">
                                <a href="{% url 'filme' %}" class="btn btn-outline-secondary order-2 order-sm-1">
                                    Cancelar
                                </a>
                                <div class="order-1 order-sm-2 d-grid d-sm-inline-block">
                                    <button type="submit" class="btn btn-success px-4 w-100">
                                        <i class="fas fa-save me-2"></i>Salvar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% block footer %}
    {% include "footer.html" %}
{% endblock %}
