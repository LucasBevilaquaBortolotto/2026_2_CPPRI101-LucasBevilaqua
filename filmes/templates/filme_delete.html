{% extends 'principal.html' %}

{% block content %}
<div class="container mt-4">
    <div class="alert alert-danger">
        <h4>Confirmar Exclusão</h4>
        <p>Tem certeza que deseja excluir o filme <strong>{{ object.titulo }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'filmes' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
