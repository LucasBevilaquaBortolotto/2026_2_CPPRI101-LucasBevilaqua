{% extends 'principal.html' %}

{% block title %}Confirmar Exclusão - Locadora de Filmes{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3.5rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Confirmar Exclusão</h3>
                    <p class="text-muted mb-4">
                        Tem certeza que deseja excluir este registro?<br>
                        <strong>Esta ação não poderá ser desfeita.</strong>
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash"></i> Sim, excluir
                            </button>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
